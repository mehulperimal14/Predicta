services:
  - type: web
    name: predicta-web
    runtime: python
    buildCommand: pip install -r requirements.txt && python backend/synthetic_generator.py
    startCommand: gunicorn -w 2 --bind 0.0.0.0:$PORT --timeout 120 --chdir backend app:app
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: NOTIFICATION_MOCK_MODE
        value: "True"
      # Open to everyone without a password (visitors get admin rights). "false" requires login.
      - key: PUBLIC_ACCESS
        value: "true"
      - key: NOTIFICATION_COOLDOWN_MINUTES
        value: "15"
      - key: ALLOW_HISTORICAL_REPLAY
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Without this, JWTs were signed with a string published in the repo.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set these in the Render dashboard. On the next deploy, any account still on
      # its published demo password is rotated to the value given here.
      - key: PREDICTA_ADMIN_PASSWORD
        sync: false
      - key: PREDICTA_ENGINEER_PASSWORD
        sync: false
      - key: PREDICTA_OPERATOR_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: predicta-db
          property: connectionString

databases:
  - name: predicta-db
    plan: free
    region: oregon
    databaseName: predicta
    user: predicta_admin
