version: "3.9"

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: predicta_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       predicta_db
      POSTGRES_USER:     predicta
      POSTGRES_PASSWORD: predicta123
    volumes:
      # Tables are created by SQLAlchemy on backend start-up (models.py is the source of truth).
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "predicta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Predicta 2.0 Web Platform (Unified Backend & Frontend) ──────────────────
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: predicta_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:          postgresql://predicta:predicta123@db:5432/predicta_db
      FLASK_ENV:             production
      # No fallback values: a published default secret lets anyone forge login tokens.
      SECRET_KEY:            ${SECRET_KEY:?Set SECRET_KEY in deployment/.env}
      JWT_SECRET_KEY:        ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in deployment/.env}
      PREDICTA_ADMIN_PASSWORD:    ${PREDICTA_ADMIN_PASSWORD:-}
      PREDICTA_ENGINEER_PASSWORD: ${PREDICTA_ENGINEER_PASSWORD:-}
      PREDICTA_OPERATOR_PASSWORD: ${PREDICTA_OPERATOR_PASSWORD:-}
      MQTT_ENABLED:          ${MQTT_ENABLED:-False}
      TELEGRAM_BOT_TOKEN:    ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID:      ${TELEGRAM_CHAT_ID}
      TWILIO_ACCOUNT_SID:    ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN:     ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER:    ${TWILIO_FROM_NUMBER}
      ALERT_SMS_RECIPIENTS:  ${ALERT_SMS_RECIPIENTS}
      NOTIFICATION_MOCK_MODE: ${NOTIFICATION_MOCK_MODE:-True}
      ALLOW_HISTORICAL_REPLAY: ${ALLOW_HISTORICAL_REPLAY:-False}
      UPLOAD_FOLDER:         /app/backend/uploads
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/backend/uploads
      - ../ml_model/saved_models:/app/ml_model/saved_models
      - ../reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 20s
      timeout: 10s
      retries: 3

volumes:
  pg_data:
  uploads_data:
