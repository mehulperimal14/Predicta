services:
  - type: web
    name: predicta-web
    runtime: python
    buildCommand: pip install -r requirements.txt && python backend/synthetic_generator.py
    startCommand: gunicorn -w 2 --bind 0.0.0.0:$PORT --timeout 120 --chdir backend app:app
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: NOTIFICATION_MOCK_MODE
        value: "True"
      - key: ALERT_COOLDOWN_MINUTES
        value: "15"
      - key: ALLOW_HISTORICAL_REPLAY
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: predicta-db
          property: connectionString

databases:
  - name: predicta-db
    plan: free
    region: oregon
    databaseName: predicta
    user: predicta_admin
